<!doctype html>
<html lang="en" class="scroll-smooth" style="background-color:#020617">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog | goalr — The Goal-Setting Playbook</title>
  <meta name="description" content="Actionable insights on goal-setting, planning, and building habits. Learn science-backed strategies to achieve more.">
  <meta property="og:title" content="goalr Blog — The Goal-Setting Playbook">
  <meta property="og:description" content="Actionable insights on goal-setting, planning, and building habits.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://goalr.ai/blog/">
  <link rel="canonical" href="https://goalr.ai/blog/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-950 text-slate-300 font-sans antialiased" style="background-color:#020617">

  <!-- ========== NAVBAR ========== -->
  <nav id="navbar" class="fixed top-0 left-0 right-0 z-50">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="/" class="flex items-center gap-2.5 focus-visible:outline-none">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" class="w-8 h-8">
          <rect width="32" height="32" rx="8" fill="#0f172a"/>
          <circle cx="16" cy="16" r="11" stroke="#059669" stroke-width="2.5" fill="none"/>
          <circle cx="16" cy="16" r="6" stroke="#10b981" stroke-width="2" fill="none"/>
          <circle cx="16" cy="16" r="2.5" fill="#34d399"/>
        </svg>
        <span class="text-xl font-extrabold text-slate-100 tracking-tight">goalr<span class="text-emerald-500">.</span></span>
      </a>
      <div class="flex items-center gap-5">
        <button id="lang-toggle" class="text-sm font-semibold text-slate-400 hover:text-slate-200 transition-colors cursor-pointer">
          <span id="lang-label">EN</span>
        </button>
        <a href="/app/" class="text-sm font-semibold text-slate-300 hover:text-white transition-colors" data-i18n="nav.signIn">Sign in</a>
      </div>
    </div>
  </nav>

  <!-- ========== BLOG LISTING ========== -->
  <section class="pt-32 pb-20 md:pt-44 md:pb-32">
    <div class="max-w-5xl mx-auto px-6">
      <div class="text-center mb-16">
        <h1 class="text-3xl md:text-5xl font-extrabold text-white tracking-tight mb-4" data-i18n="blog.sectionTitle">The Goal-Setting Playbook</h1>
        <p class="text-lg text-slate-400 max-w-2xl mx-auto" data-i18n="blog.sectionSubtitle">Actionable insights to help you plan smarter and achieve more.</p>
      </div>

      <div class="grid md:grid-cols-3 gap-6">
        {{POSTS_GRID}}
      </div>
    </div>
  </section>

  <!-- ========== CTA ========== -->
  <section class="py-24 md:py-32">
    <div class="max-w-3xl mx-auto px-6 text-center">
      <h2 class="landing-animate text-3xl md:text-5xl font-extrabold text-white tracking-tight mb-6" data-i18n="blog.cta.title">
        Ready to put this into practice?
      </h2>
      <p class="landing-animate text-slate-400 text-lg mb-10" data-i18n="blog.cta.subtitle">
        Start tracking your goals for free. No credit card required.
      </p>
      <div class="landing-animate">
        <a href="/app/" class="inline-flex items-center justify-center px-10 py-4 bg-emerald-500 hover:bg-emerald-400 text-white font-bold rounded-xl text-lg transition-all hover:shadow-lg hover:shadow-emerald-500/25 active:scale-95" data-i18n="blog.cta.button">
          Start for free
        </a>
      </div>
    </div>
  </section>

  <!-- ========== FOOTER ========== -->
  <footer class="border-t border-slate-800/50 py-10">
    <div class="max-w-6xl mx-auto px-6 flex flex-col md:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" class="w-6 h-6">
          <rect width="32" height="32" rx="8" fill="#0f172a"/>
          <circle cx="16" cy="16" r="11" stroke="#059669" stroke-width="2.5" fill="none"/>
          <circle cx="16" cy="16" r="6" stroke="#10b981" stroke-width="2" fill="none"/>
          <circle cx="16" cy="16" r="2.5" fill="#34d399"/>
        </svg>
        <span class="text-sm font-bold text-slate-400">goalr<span class="text-emerald-500">.</span></span>
      </div>
      <div class="flex items-center gap-6">
        <a href="/blog/" class="text-xs text-slate-500 hover:text-slate-300 transition-colors">Blog</a>
        <p class="text-xs text-slate-500">
          <span data-i18n="footer.tagline">Made with ambition.</span> &copy; 2026 goalr
        </p>
      </div>
    </div>
  </footer>

  <script type="module" src="/src/blog/main.ts"></script>
</body>
</html>
